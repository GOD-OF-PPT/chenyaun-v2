name: E2E Regression & Art Provenance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  regression:
    name: Art Manifest & 1440x900 Chromium Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deterministic standalone build matches src/
        run: npm run build:check

      - name: Run pure Node unit test suite
        run: npm run test:unit

      - name: Verify inline JS syntax in playable-v2.html
        run: |
          node -e '
            const fs = require("node:fs");
            const vm = require("node:vm");
            const html = fs.readFileSync("web/public/playable-v2.html", "utf8");
            const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
            if (scripts.length === 0) {
              throw new Error("No inline <script> blocks found in web/public/playable-v2.html");
            }
            scripts.forEach((m, idx) => {
              new vm.Script(m[1], { filename: `web/public/playable-v2.html#script-${idx}` });
            });
            console.log(`Inline JS syntax OK (${scripts.length} script block(s) validated).`);
          '

      - name: Verify art provenance manifest is up to date
        run: npm run art:manifest:check

      - name: Install Playwright Chromium and export CHROMIUM_PATH
        run: |
          npx playwright-core install --with-deps chromium
          CHROMIUM_BIN="$(node -e 'import("playwright-core").then((m) => console.log(m.chromium.executablePath()))')"
          echo "Resolved Playwright Chromium: ${CHROMIUM_BIN}"
          test -x "${CHROMIUM_BIN}"
          echo "CHROMIUM_PATH=${CHROMIUM_BIN}" >> "$GITHUB_ENV"

      - name: Run 1440x900 Playwright regression suite
        id: regression
        continue-on-error: true
        run: |
          mkdir -p test-results/screenshots
          npm run test:regression -- \
            --report test-results/regression-report.json \
            --screenshots test-results/screenshots

      - name: Run E2E acceptance suite
        id: e2e
        continue-on-error: true
        run: |
          mkdir -p test-results
          npm run test:e2e -- --report test-results/e2e-report.json

      - name: Upload regression & E2E reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce regression and E2E pass gate
        if: ${{ !cancelled() && (steps.regression.outcome != 'skipped' || steps.e2e.outcome != 'skipped') }}
        run: |
          echo "Regression outcome: ${{ steps.regression.outcome }}"
          echo "E2E outcome: ${{ steps.e2e.outcome }}"
          if [ "${{ steps.regression.outcome }}" != "success" ] || [ "${{ steps.e2e.outcome }}" != "success" ]; then
            echo "One or more test suites failed."
            exit 1
          fi
